name: Verify Structure
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile skeletons and tests
        run: mvn compile test-compile --no-transfer-progress
      - name: Verify HINTS.md present for every problem
        run: |
          missing=0
          for dir in beginner intermediate advanced expert; do
            for problem in $dir/*/; do
              if [ ! -f "$problem/HINTS.md" ]; then
                echo "Missing HINTS.md: $problem"
                missing=1
              fi
            done
          done
          exit $missing

  test-solutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solutions
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run all tests against solutions
        run: mvn test --no-transfer-progress